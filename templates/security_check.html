<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check - EncCloudStorage</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .dice-container {
            perspective: 1000px;
            margin: 20px 0;
        }
        
        .dice {
            width: 80px;
            height: 80px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            margin: 0 10px;
            display: inline-block;
        }
        
        .dice-face {
            position: absolute;
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .dice-face:nth-child(1) { transform: rotateY(0deg) translateZ(40px); }
        .dice-face:nth-child(2) { transform: rotateY(90deg) translateZ(40px); }
        .dice-face:nth-child(3) { transform: rotateY(180deg) translateZ(40px); }
        .dice-face:nth-child(4) { transform: rotateY(-90deg) translateZ(40px); }
        .dice-face:nth-child(5) { transform: rotateX(90deg) translateZ(40px); }
        .dice-face:nth-child(6) { transform: rotateX(-90deg) translateZ(40px); }
        
        .dice.rolling {
            animation: roll 1s infinite;
        }
        
        @keyframes roll {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            25% { transform: rotateX(90deg) rotateY(90deg); }
            50% { transform: rotateX(180deg) rotateY(180deg); }
            75% { transform: rotateX(270deg) rotateY(270deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }
        
        .security-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .security-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .dice-result {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .input-group {
            margin: 20px 0;
        }
        
        .btn-security {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-security:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .error-message {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .success-message {
            color: #28a745;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="security-container">
        <div class="security-card">
            <div class="mb-4">
                <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
                <h2 class="text-dark">Security Verification</h2>
                <p class="text-muted">Complete the security check to continue</p>
            </div>
            
            <div class="dice-container">
                <div class="dice" id="dice1">
                    <div class="dice-face">1</div>
                    <div class="dice-face">2</div>
                    <div class="dice-face">3</div>
                    <div class="dice-face">4</div>
                    <div class="dice-face">5</div>
                    <div class="dice-face">6</div>
                </div>
                <div class="dice" id="dice2">
                    <div class="dice-face">1</div>
                    <div class="dice-face">2</div>
                    <div class="dice-face">3</div>
                    <div class="dice-face">4</div>
                    <div class="dice-face">5</div>
                    <div class="dice-face">6</div>
                </div>
            </div>
            
            <div class="dice-result" id="diceResult">
                <span id="resultText">Rolling...</span>
            </div>
            
            <form id="securityForm" method="POST">
                <div class="input-group">
                    <input type="number" class="form-control form-control-lg text-center" 
                           id="userInput" name="dice_sum" placeholder="Enter the sum" 
                           min="2" max="12" required>
                </div>
                
                <button type="submit" class="btn btn-security btn-lg w-100" id="submitBtn">
                    <i class="fas fa-check"></i> Verify & Continue
                </button>
                
                <div id="message"></div>
            </form>
            
            <div class="mt-4">
                <small class="text-muted">
                    <i class="fas fa-info-circle"></i>
                    Watch the dice roll and enter the correct sum to proceed
                </small>
            </div>
        </div>
    </div>

    <script>
        let dice1Value, dice2Value, correctSum;
        let isRolling = false;
        
        // Initialize dice rolling
        function initDiceRoll() {
            isRolling = true;
            document.getElementById('dice1').classList.add('rolling');
            document.getElementById('dice2').classList.add('rolling');
            document.getElementById('resultText').textContent = 'Rolling...';
            document.getElementById('userInput').value = '';
            document.getElementById('message').innerHTML = '';
            
            // Stop rolling after 3 seconds
            setTimeout(() => {
                stopDiceRoll();
            }, 3000);
        }
        
        function stopDiceRoll() {
            isRolling = false;
            document.getElementById('dice1').classList.remove('rolling');
            document.getElementById('dice2').classList.remove('rolling');
            
            // Generate random values
            dice1Value = Math.floor(Math.random() * 6) + 1;
            dice2Value = Math.floor(Math.random() * 6) + 1;
            correctSum = dice1Value + dice2Value;
            
            // Update display
            document.getElementById('resultText').textContent = `${dice1Value} + ${dice2Value} = ?`;
            document.getElementById('userInput').focus();
        }
        
        // Handle form submission
        document.getElementById('securityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (isRolling) {
                document.getElementById('message').innerHTML = 
                    '<div class="error-message">Please wait for the dice to stop rolling!</div>';
                return;
            }
            
            const userInput = parseInt(document.getElementById('userInput').value);
            
            if (userInput === correctSum) {
                document.getElementById('message').innerHTML = 
                    '<div class="success-message"><i class="fas fa-check"></i> Correct! Redirecting...</div>';
                
                // Redirect to login page after successful verification
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                document.getElementById('message').innerHTML = 
                    '<div class="error-message"><i class="fas fa-times"></i> Incorrect! Try again.</div>';
                
                // Re-roll dice after incorrect answer
                setTimeout(() => {
                    initDiceRoll();
                }, 2000);
            }
        });
        
        // Start initial dice roll
        initDiceRoll();
        
        // Re-roll dice every 30 seconds if no interaction
        setInterval(() => {
            if (!isRolling && document.getElementById('userInput').value === '') {
                initDiceRoll();
            }
        }, 30000);
    </script>
</body>
</html>
